{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <div class="card" style="max-width:420px;">
    <form class="stacked" method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button class="btn" type="submit" id="login-submit-btn" style="margin-top:18px;width:100%;">Log in</button>
    </form>
  </div>
  <p class="lead">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
