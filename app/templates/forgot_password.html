{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
  <h1>Reset your password</h1>
  <div class="card" style="max-width:420px;">
    <form class="stacked" method="post" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required>
      <button class="btn" type="submit" id="forgot-submit-btn" style="margin-top:18px;width:100%;">Send reset link</button>
    </form>
  </div>
  <p class="lead"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
{% endblock %}
