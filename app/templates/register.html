{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <h1>Create your account</h1>
  <p class="lead">Registration automatically starts you on the Free plan.</p>
  <div class="card" style="max-width:420px;">
    <form class="stacked" method="post" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="8" required>
      <button class="btn" type="submit" style="margin-top:18px;width:100%;">Register</button>
    </form>
  </div>
  <p class="lead">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
